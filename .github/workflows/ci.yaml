name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Helm
        env:
          HELM_VERSION: v3.15.2
        run: |
          set -euo pipefail
          asset="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "https://get.helm.sh/${asset}" -o "${RUNNER_TEMP}/${asset}"
          curl -fsSL "https://get.helm.sh/${asset}.sha256sum" -o "${RUNNER_TEMP}/${asset}.sha256sum"
          cd "${RUNNER_TEMP}"
          sha256sum -c "${asset}.sha256sum"
          tar -xzf "${asset}"
          mv linux-amd64/helm "${RUNNER_TEMP}/bin/helm"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Run fast checks and coverage gate
        run: make verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            .tmp/coverage.out
            .tmp/coverage.txt
          retention-days: 14

  image-build:
    name: image-${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component:
          - controller
          - node
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --target "${{ matrix.component }}" \
            --build-arg VERSION=ci \
            --tag "shiftpv-${{ matrix.component }}:ci" \
            --file build/package/Dockerfile \
            .

      - name: Verify entrypoint
        run: docker run --rm "shiftpv-${{ matrix.component }}:ci" --help

      - name: Verify image boundary
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ "${COMPONENT}" == "controller" ]]; then
            expected=/shiftpv-controller
            unexpected=/shiftpv-node
          else
            expected=/shiftpv-node
            unexpected=/shiftpv-controller
          fi
          docker run --rm --entrypoint /bin/sh "shiftpv-${COMPONENT}:ci" \
            -ec "test -x '${expected}' && test ! -e '${unexpected}'"

  linux-mount:
    name: linux-mount
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run isolated Linux mount integration
        run: make linux-mount-integration

  kind-e2e:
    name: kind-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Kubernetes tools
        env:
          KIND_VERSION: v0.33.0
          KUBECTL_VERSION: v1.35.8
          HELM_VERSION: v3.15.2
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"

          kind_asset="kind-linux-amd64"
          kind_url="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          curl -fsSL "${kind_url}/${kind_asset}" -o "${RUNNER_TEMP}/${kind_asset}"
          curl -fsSL "${kind_url}/${kind_asset}.sha256sum" -o "${RUNNER_TEMP}/${kind_asset}.sha256sum"
          cd "${RUNNER_TEMP}"
          sha256sum -c "${kind_asset}.sha256sum"
          chmod +x "${kind_asset}"
          mv "${kind_asset}" "${RUNNER_TEMP}/bin/kind"

          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o kubectl
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" -o kubectl.sha256
          printf '%s  kubectl\n' "$(<kubectl.sha256)" | sha256sum -c -
          chmod +x kubectl
          mv kubectl "${RUNNER_TEMP}/bin/kubectl"

          helm_asset="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/${helm_asset}" -o "${helm_asset}"
          curl -fsSL "https://get.helm.sh/${helm_asset}.sha256sum" -o "${helm_asset}.sha256sum"
          sha256sum -c "${helm_asset}.sha256sum"
          tar -xzf "${helm_asset}"
          mv linux-amd64/helm "${RUNNER_TEMP}/bin/helm"

          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Report tool versions
        run: |
          docker info --format 'Docker {{.ServerVersion}} {{.OSType}}/{{.Architecture}}'
          kind version
          kubectl version --client
          helm version --short

      - name: Run isolated kind E2E
        env:
          KEEP_CLUSTER: "1"
        run: ./test/e2e/kind/run.sh

      - name: Export failure diagnostics
        if: failure()
        run: |
          mkdir -p .tmp/ci-diagnostics
          kind export logs .tmp/ci-diagnostics/kind --name shiftpv-e2e || true
          kubectl get nodes,pods,pvc,pv,storageclass,csinode -A -o wide > .tmp/ci-diagnostics/resources.txt 2>&1 || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp > .tmp/ci-diagnostics/events.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-e2e-diagnostics
          path: .tmp/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name shiftpv-e2e || true
