name: Install pinned Kubernetes tools
description: >-
  Download, checksum-verify, and PATH-register the pinned kind, kubectl, and
  helm binaries used by ShiftPV CI. The pinned versions live here so every
  workflow shares one source of truth; a caller may still override them.

inputs:
  kind:
    description: Install kind when set to 'true'.
    required: false
    default: "true"
  kubectl:
    description: Install kubectl when set to 'true'.
    required: false
    default: "true"
  helm:
    description: Install helm when set to 'true'.
    required: false
    default: "true"
  kind-version:
    description: Pinned kind release tag.
    required: false
    default: v0.33.0
  kubectl-version:
    description: Pinned kubectl release tag.
    required: false
    default: v1.35.8
  helm-version:
    description: Pinned helm release tag.
    required: false
    default: v3.15.2
  report-versions:
    description: Print docker/kind/kubectl/helm versions after install when set to 'true'.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned Kubernetes tools
      shell: bash
      env:
        INSTALL_KIND: ${{ inputs.kind }}
        INSTALL_KUBECTL: ${{ inputs.kubectl }}
        INSTALL_HELM: ${{ inputs.helm }}
        KIND_VERSION: ${{ inputs.kind-version }}
        KUBECTL_VERSION: ${{ inputs.kubectl-version }}
        HELM_VERSION: ${{ inputs.helm-version }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/bin"
        cd "${RUNNER_TEMP}"

        if [[ "${INSTALL_KIND}" == "true" ]]; then
          kind_asset="kind-linux-amd64"
          kind_url="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          curl -fsSL "${kind_url}/${kind_asset}" -o "${RUNNER_TEMP}/${kind_asset}"
          curl -fsSL "${kind_url}/${kind_asset}.sha256sum" -o "${RUNNER_TEMP}/${kind_asset}.sha256sum"
          sha256sum -c "${kind_asset}.sha256sum"
          chmod +x "${kind_asset}"
          mv "${kind_asset}" "${RUNNER_TEMP}/bin/kind"
        fi

        if [[ "${INSTALL_KUBECTL}" == "true" ]]; then
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o kubectl
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" -o kubectl.sha256
          printf '%s  kubectl\n' "$(<kubectl.sha256)" | sha256sum -c -
          chmod +x kubectl
          mv kubectl "${RUNNER_TEMP}/bin/kubectl"
        fi

        if [[ "${INSTALL_HELM}" == "true" ]]; then
          helm_asset="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/${helm_asset}" -o "${helm_asset}"
          curl -fsSL "https://get.helm.sh/${helm_asset}.sha256sum" -o "${helm_asset}.sha256sum"
          sha256sum -c "${helm_asset}.sha256sum"
          tar -xzf "${helm_asset}"
          mv linux-amd64/helm "${RUNNER_TEMP}/bin/helm"
        fi

        echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

    - name: Report tool versions
      if: inputs.report-versions == 'true'
      shell: bash
      run: |
        export PATH="${RUNNER_TEMP}/bin:${PATH}"
        docker info --format 'Docker {{.ServerVersion}} {{.OSType}}/{{.Architecture}}'
        kind version
        kubectl version --client
        helm version --short
