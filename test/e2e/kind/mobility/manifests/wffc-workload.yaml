apiVersion: v1
kind: Namespace
metadata:
  name: shiftpv-mobility-test
  labels:
    shiftpv.io/admission: enabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wffc
  namespace: shiftpv-mobility-test
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: shiftpv
  resources:
    requests:
      storage: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wffc
  namespace: shiftpv-mobility-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shiftpv-mobility-wffc
  template:
    metadata:
      labels:
        app: shiftpv-mobility-wffc
    spec:
      containers:
        - name: writer
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              if [ ! -f /data/payload ]; then
                printf 'ShiftPV placement hold test\n' > /data/payload
              fi
              sleep 3600
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wffc
