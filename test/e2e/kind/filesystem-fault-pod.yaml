apiVersion: v1
kind: Pod
metadata:
  name: shiftpv-filesystem-fault
spec:
  restartPolicy: Never
  nodeSelector:
    shiftpv.io/fault-node: "true"
  containers:
    - name: writer
      image: busybox:1.37
      command:
        - sh
        - -ec
        - |
          printf 'ShiftPV filesystem fault recovery\n' > /data/payload
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: shiftpv-filesystem-fault
