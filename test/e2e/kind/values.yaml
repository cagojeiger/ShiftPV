metrics:
  enabled: true
  snapshotInterval: 2s

runtime:
  identityContract: true

controller:
  image:
    repository: shiftpv
    tag: dev
    pullPolicy: IfNotPresent

mobility:
  helperImage: shiftpv:dev

helperPod:
  image: shiftpv:dev

poolReadiness:
  interval: 2s
  staleAfter: 10s

node:
  kubeletRootDir: /var/lib/kubelet
  image:
    repository: shiftpv
    tag: dev
    pullPolicy: IfNotPresent
  nodeSelector:
    shiftpv.io/storage-node: "true"

storageClass:
  create: true
  name: shiftpv
  defaultClass: true
  reclaimPolicy: Retain
