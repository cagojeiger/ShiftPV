controller:
  image:
    repository: shiftpv
    tag: dev
    pullPolicy: IfNotPresent

mobility:
  helperImage: shiftpv:dev

node:
  kubeletRootDir: /var/lib/kubelet
  image:
    repository: shiftpv
    tag: dev
    pullPolicy: IfNotPresent
  nodeSelector:
    shiftpv.io/storage-node: "true"

storageClass:
  create: true
  name: shiftpv
  defaultClass: true
  reclaimPolicy: Retain
