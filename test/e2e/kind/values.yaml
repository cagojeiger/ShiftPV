metrics:
  enabled: true
  snapshotInterval: 2s

controller:
  image:
    repository: shiftpv
    tag: dev
    pullPolicy: IfNotPresent

mobility:
  helperImage: shiftpv:dev
  # The suite cordons nodes and then waits for move discovery. At the 30s chart
  # default every such wait sits up to one full tick from its own timeout; the
  # mobility suites already pass 10s for the same reason.
  interval: 10s

helperPod:
  image: shiftpv:dev

poolReadiness:
  interval: 2s
  staleAfter: 10s

node:
  kubeletRootDir: /var/lib/kubelet
  image:
    repository: shiftpv
    tag: dev
    pullPolicy: IfNotPresent
  nodeSelector:
    shiftpv.io/storage-node: "true"

storageClass:
  create: true
  name: shiftpv
  defaultClass: true
  reclaimPolicy: Delete

retainStorageClass:
  create: true
  name: shiftpv-retain
  defaultClass: false
  reclaimPolicy: Retain
