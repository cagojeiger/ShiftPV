apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shiftpv-argocd-e2e
spec:
  storageClassName: shiftpv
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: shiftpv-argocd-e2e
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.37
      command:
        - sh
        - -ec
        - |
          if [ ! -f /data/payload ]; then
            printf 'ShiftPV Argo CD uninstall guard\n' > /data/payload
          fi
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: shiftpv-argocd-e2e
