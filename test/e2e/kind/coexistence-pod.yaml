apiVersion: v1
kind: Pod
metadata:
  name: shiftpv-coexistence
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.37
      command:
        - sh
        - -ec
        - |
          printf 'ShiftPV StorageClass coexistence\n' > /data/payload
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: shiftpv-coexistence
