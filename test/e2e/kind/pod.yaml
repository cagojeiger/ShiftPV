apiVersion: v1
kind: Pod
metadata:
  name: shiftpv-e2e
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.37
      command:
        - sh
        - -ec
        - |
          if [ ! -f /data/payload ]; then
            printf 'ShiftPV retained data\n' > /data/payload
          fi
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: shiftpv-e2e
