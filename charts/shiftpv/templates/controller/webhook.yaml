apiVersion: v1
kind: Service
metadata:
  name: {{ include "shiftpv.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "shiftpv.selectorLabels" (dict "root" . "component" "controller") | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: webhook
