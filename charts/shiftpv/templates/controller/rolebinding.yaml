apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shiftpv.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shiftpv.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "shiftpv.controllerServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
