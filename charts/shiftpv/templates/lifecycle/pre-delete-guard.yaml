apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shiftpv.uninstallGuardName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: uninstall-guard
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PreDelete
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shiftpv.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: uninstall-guard
    spec:
      serviceAccountName: {{ include "shiftpv.controllerServiceAccount" . }}
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: uninstall-guard
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command: ["/shiftpv-uninstall-guard"]
          args:
            - --storage-class={{ .Values.storageClass.name }}
            - --permit-namespace={{ .Release.Namespace }}
            - --permit-name={{ include "shiftpv.uninstallPermitName" . }}
            - --validation-webhook={{ include "shiftpv.validationWebhookConfigurationName" . }}
            - --timeout=45s
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
