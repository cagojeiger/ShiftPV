apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shiftpv.fullname" . }}-node
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
rules:
  - apiGroups: ["shiftpv.io"]
    resources: ["shiftpvpools"]
    verbs: ["get", "list"]
  - apiGroups: ["shiftpv.io"]
    resources: ["shiftpvvolumes"]
    verbs: ["get"]
  - apiGroups: ["shiftpv.io"]
    resources: ["shiftpvvolumes/status"]
    verbs: ["get", "update", "patch"]
