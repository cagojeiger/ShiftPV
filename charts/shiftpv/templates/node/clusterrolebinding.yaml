apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shiftpv.fullname" . }}-node
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shiftpv.fullname" . }}-node
subjects:
  - kind: ServiceAccount
    name: {{ include "shiftpv.nodeServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
