apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shiftpv.fullname" . }}-helper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
{{ include "shiftpv.bindingBody" (dict
  "root" .
  "kind" "Role"
  "name" (printf "%s-helper" (include "shiftpv.fullname" .))
  "serviceAccount" (include "shiftpv.helperServiceAccount" .)) }}
