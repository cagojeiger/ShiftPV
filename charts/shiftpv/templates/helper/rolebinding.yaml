{{- if .Values.runtime.identityContract }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shiftpv.fullname" . }}-helper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shiftpv.fullname" . }}-helper
subjects:
  - kind: ServiceAccount
    name: {{ include "shiftpv.helperServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
