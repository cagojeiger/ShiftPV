apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftpvcleanups.shiftpv.io
spec:
  group: shiftpv.io
  scope: Cluster
  names:
    plural: shiftpvcleanups
    singular: shiftpvcleanup
    kind: ShiftPVCleanup
    shortNames: [scu]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Node
          type: string
          jsonPath: .spec.target.nodeName
        - name: Volume
          type: string
          jsonPath: .spec.target.volumeID
        - name: Reason
          type: string
          jsonPath: .status.reason
      schema:
        openAPIV3Schema:
          type: object
          required: [apiVersion, kind, metadata, spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [operationID, target, reason, authority, approved]
              x-kubernetes-validations:
                - rule: self.operationID == oldSelf.operationID && self.target == oldSelf.target && self.reason == oldSelf.reason && self.authority == oldSelf.authority && has(self.reservationUID) == has(oldSelf.reservationUID) && (!has(self.reservationUID) || self.reservationUID == oldSelf.reservationUID)
                  message: cleanup identity and authority are immutable
                - rule: '!oldSelf.approved || self.approved'
                  message: cleanup approval cannot be revoked
              properties:
                operationID:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'
                target:
                  type: object
                  required: [installationID, poolName, poolUID, volumeID, volumeUID, copyID, nodeName, role]
                  properties:
                    installationID:
                      type: string
                      minLength: 1
                      maxLength: 128
                    poolName:
                      type: string
                      minLength: 1
                      maxLength: 253
                    poolUID:
                      type: string
                      minLength: 1
                      maxLength: 128
                    volumeID:
                      type: string
                      pattern: ^shiftpv-[a-f0-9]{32}$
                    volumeUID:
                      type: string
                      minLength: 1
                      maxLength: 128
                    copyID:
                      type: string
                      minLength: 1
                      maxLength: 128
                    nodeName:
                      type: string
                      minLength: 1
                      maxLength: 253
                    role:
                      type: string
                      enum: [Serving, Incoming, Retired]
                reason:
                  type: string
                  enum: [MoveSource, VolumeDelete, OrphanReclaim]
                authority:
                  type: object
                  required: [kind, name, uid]
                  properties:
                    kind:
                      type: string
                      enum: [Namespace, ShiftPVVolume, ShiftPVMove]
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                    uid:
                      type: string
                      minLength: 1
                      maxLength: 128
                reservationUID:
                  description: Exact orphan reservation owned by this cleanup; omitted when no reservation is reclaimed.
                  type: string
                  minLength: 1
                  maxLength: 128
                approved:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Verifying, Completed, NeedsReview]
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                reason:
                  type: string
                message:
                  type: string
                lastTransitionTime:
                  type: string
                  format: date-time
                executor:
                  type: object
                  required: [jobName, jobUID, nodeName]
                  properties:
                    jobName:
                      type: string
                    jobUID:
                      type: string
                    podUID:
                      type: string
                    nodeName:
                      type: string
                receipt:
                  type: object
                  required: [operationID, executorUID, observedAt, retired, purged]
                  properties:
                    operationID:
                      type: string
                    executorUID:
                      type: string
                    observedAt:
                      type: string
                      format: date-time
                    retired:
                      type: boolean
                    purged:
                      type: boolean
                    localReceiptDigest:
                      type: string
                      pattern: '^[a-f0-9]{64}$'
                settledAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
