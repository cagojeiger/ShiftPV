apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftpvpools.shiftpv.io
spec:
  group: shiftpv.io
  scope: Cluster
  names:
    plural: shiftpvpools
    singular: shiftpvpool
    kind: ShiftPVPool
    shortNames: [sp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: LastProbe
          type: date
          jsonPath: .status.lastProbeTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeName, mountPath, capacity]
              properties:
                nodeName:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: nodeName is immutable
                mountPath:
                  type: string
                  minLength: 2
                  pattern: ^/
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: mountPath is immutable
                    - rule: self != '/'
                      message: mountPath must not be the filesystem root
                capacity:
                  type: object
                  required: [limit]
                  properties:
                    limit:
                      type: string
                      minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                lastProbeTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                      message:
                        type: string
                inventory:
                  type: object
                  required: [observedAt, valid]
                  properties:
                    observedAt:
                      type: string
                      format: date-time
                    valid:
                      type: boolean
                    truncated:
                      type: boolean
                    message:
                      type: string
                    copies:
                      type: array
                      maxItems: 256
                      items:
                        type: object
                        required: [marker, present]
                        properties:
                          marker:
                            type: string
                          present:
                            type: boolean
                          published:
                            type: boolean
                          problem:
                            type: string
                          identity:
                            type: object
                            required: [installationID, poolName, poolUID, volumeID, volumeUID, copyID, nodeName, role]
                            properties:
                              installationID: {type: string}
                              poolName: {type: string}
                              poolUID: {type: string}
                              volumeID: {type: string}
                              volumeUID: {type: string}
                              copyID: {type: string}
                              nodeName: {type: string}
                              role:
                                type: string
                                enum: [Serving, Incoming, Retired]
      subresources:
        status: {}
