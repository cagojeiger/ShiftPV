apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftpvpools.shiftpv.io
spec:
  group: shiftpv.io
  scope: Cluster
  names:
    plural: shiftpvpools
    singular: shiftpvpool
    kind: ShiftPVPool
    shortNames: [sp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeName, mountPath]
              properties:
                nodeName:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: nodeName is immutable
                mountPath:
                  type: string
                  minLength: 2
                  pattern: ^/
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: mountPath is immutable
                    - rule: self != '/'
                      message: mountPath must not be the filesystem root
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
