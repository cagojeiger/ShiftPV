apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftpvvolumes.shiftpv.io
  labels:
    shiftpv.io/uninstall-protected: "true"
spec:
  group: shiftpv.io
  scope: Cluster
  names:
    plural: shiftpvvolumes
    singular: shiftpvvolume
    kind: ShiftPVVolume
    shortNames: [sv]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Owner
          type: string
          jsonPath: .status.ownerNode
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [volumeID, requestName, initialNode, capacityBytes]
              properties:
                volumeID:
                  type: string
                  pattern: ^shiftpv-[a-f0-9]{32}$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: volumeID is immutable
                requestName:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: requestName is immutable
                initialNode:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: initialNode is immutable
                capacityBytes:
                  type: integer
                  format: int64
                  minimum: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: capacityBytes is immutable
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Ready, Deleting, Moving, Blocked]
                ownerNode:
                  type: string
                activeMove:
                  type: string
                publishedNodes:
                  type: array
                  items:
                    type: string
                  x-kubernetes-list-type: set
                creationOperationID:
                  type: string
                deletionOperationID:
                  type: string
                currentCopy: &copyIdentity
                  type: object
                  required: [installationID, poolName, poolUID, volumeID, volumeUID, copyID, nodeName, role]
                  properties:
                    installationID:
                      type: string
                    poolName:
                      type: string
                    poolUID:
                      type: string
                    volumeID:
                      type: string
                    volumeUID:
                      type: string
                    copyID:
                      type: string
                    nodeName:
                      type: string
                    role:
                      type: string
                      enum: [Serving, Incoming, Retired]
                cleanup:
                  type: object
                  required: [spec, status]
                  properties:
                    spec:
                      type: object
                      required: [operationID, target, reason, authority]
                      properties:
                        operationID:
                          type: string
                          minLength: 1
                        target: *copyIdentity
                        reason:
                          type: string
                          enum: [VolumeDelete]
                        authority:
                          type: object
                          required: [kind, name, uid]
                          properties:
                            kind:
                              type: string
                              enum: [ShiftPVVolume]
                            name:
                              type: string
                              minLength: 1
                            uid:
                              type: string
                              minLength: 1
                    status:
                      type: object
                      required: [phase]
                      properties:
                        phase:
                          type: string
                          enum: [Pending, Running, Verifying, ConfirmingAbsence, Completed, NeedsReview]
                        observedGeneration:
                          type: integer
                          format: int64
                        reason:
                          type: string
                        message:
                          type: string
                        lastTransitionTime:
                          type: string
                          format: date-time
                        executor:
                          type: object
                          required: [jobName, jobUID, nodeName]
                          properties:
                            jobName:
                              type: string
                              minLength: 1
                            jobUID:
                              type: string
                              minLength: 1
                            podUID:
                              type: string
                            nodeName:
                              type: string
                              minLength: 1
                        receipt:
                          type: object
                          required: [operationID, executorUID, observedAt, retired, purged, localReceiptDigest]
                          properties:
                            operationID:
                              type: string
                              minLength: 1
                            executorUID:
                              type: string
                              minLength: 1
                            observedAt:
                              type: string
                              format: date-time
                            retired:
                              type: boolean
                            purged:
                              type: boolean
                            localReceiptDigest:
                              type: string
                              pattern: '^[0-9a-f]{64}$'
                        absenceProof:
                          type: object
                          required: [requestID, poolName, poolUID, requiredGeneration]
                          properties:
                            requestID:
                              type: string
                              minLength: 1
                            poolName:
                              type: string
                              minLength: 1
                            poolUID:
                              type: string
                              minLength: 1
                            requiredGeneration:
                              type: integer
                              format: int64
                              minimum: 1
                            observedGeneration:
                              type: integer
                              format: int64
                            valid:
                              type: boolean
                            complete:
                              type: boolean
                            absent:
                              type: boolean
                            confirmedAt:
                              type: string
                              format: date-time
                        settledAt:
                          type: string
                          format: date-time
      subresources:
        status: {}
