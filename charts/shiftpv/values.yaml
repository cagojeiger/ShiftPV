imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

controller:
  replicas: 1
  logLevel: 2
  image:
    repository: ghcr.io/cagojeiger/shiftpv-controller
    tag: 0.1.2
    pullPolicy: IfNotPresent
  resources: {}

mobility:
  enabled: true
  interval: 2s
  webhookPort: 9443
  helperImage: ghcr.io/cagojeiger/shiftpv-controller:0.1.2

node:
  kubeletRootDir: /var/lib/kubelet
  logLevel: 2
  image:
    repository: ghcr.io/cagojeiger/shiftpv-node
    tag: 0.1.1
    pullPolicy: IfNotPresent
  nodeSelector: {}
  tolerations: []
  resources: {}

helperPod:
  image: busybox:1.37
  timeout: 2m
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

lifecycle:
  # Use argocd when Argo CD owns this release so a blocked Application deletion
  # stays pending and completes automatically after storage dependencies are removed.
  uninstallMode: helm

storageClass:
  create: true
  name: shiftpv
  defaultClass: false
  reclaimPolicy: Retain

serviceAccount:
  controller:
    create: true
    name: ""
  node:
    create: true
    name: ""

sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
    resources: {}
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
    resources: {}
  livenessProbe:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
    resources: {}
